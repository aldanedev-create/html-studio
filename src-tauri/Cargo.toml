[package]
name = "html-studio"
version = "0.1.0"
description = "A friendly native HTML, CSS, JavaScript and Teloce learning IDE"
authors = ["Flaxon Labs"]
edition = "2021"

[lib]
name = "vel_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
