[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "html-studio"
version = "0.1.0"
description = "A friendly native HTML, CSS, JavaScript and Teloce .vel learning IDE"
requires-python = ">=3.11"
dependencies = [
    "flaxon>=0.2.3",
    "teloce-py>=0.2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
